name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'YoadElkayam/mcp-fuse'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # OIDC trusted publishing requires a recent npm CLI
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      # npm (unlike pnpm) doesn't rewrite workspace:* on publish; pin it to the real version
      - name: Resolve workspace dependency version
        run: |
          node -e '
            const fs = require("fs");
            const core = JSON.parse(fs.readFileSync("packages/core/package.json", "utf8"));
            const proxyPath = "packages/proxy/package.json";
            const proxy = JSON.parse(fs.readFileSync(proxyPath, "utf8"));
            proxy.dependencies["mcp-fuse-core"] = "^" + core.version;
            fs.writeFileSync(proxyPath, JSON.stringify(proxy, null, 2) + "\n");
          '
      - name: Publish mcp-fuse-core
        working-directory: packages/core
        run: npm publish --provenance --access public
      - name: Publish mcp-fuse
        working-directory: packages/proxy
        run: npm publish --provenance --access public
